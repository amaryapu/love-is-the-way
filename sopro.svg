<g font-family="ui-monospace,monospace" font-size="15" fill="#C9A227" text-anchor="middle">
<text x="600.0" y="372.0" opacity="0">vão = 0 · fusão de caminhos<animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="1;1;0;0;0;1" keyTimes="0;0.28;0.33;0.61;0.94;1"/></text>
<text x="600.0" y="372.0" opacity="0" fill="#9A9A9A">vão → ∞ · canal fechado<animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.28;0.33;0.61;0.66;1"/></text>
<text x="600.0" y="372.0" opacity="0">vão = φ · ambos alcançam, nenhum absorve<animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.61;0.66;0.94;1"/></text>
</g>
<g font-family="ui-sans-serif,system-ui" font-size="26" font-weight="700" text-anchor="middle">
<text x="600.0" y="86" fill="#C2554B" opacity="0">IN-FLUÊNCIA<animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="1;0;0;0;1" keyTimes="0;0.28;0.61;0.94;1"/></text>
<text x="600.0" y="86" fill="#6B6B6B" opacity="0">DES-FLUÊNCIA<animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;1;0;0;0" keyTimes="0;0.28;0.61;0.94;1"/></text>
<text x="600.0" y="86" fill="#C9A227" opacity="0">CON-FLUÊNCIA<animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;0;0" keyTimes="0;0.28;0.61;0.94;1"/></text>
</g>
<g font-family="ui-sans-serif,system-ui" font-size="14" fill="#7E93A5" text-anchor="middle">
<text x="600.0" y="112" opacity="0">um alcança, o outro não — e se tocar, absorve<animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="1;0;0;0;1" keyTimes="0;0.28;0.61;0.94;1"/></text>
<text x="600.0" y="112" opacity="0">os dois recolhem — o canal fecha<animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;1;0;0;0" keyTimes="0;0.28;0.61;0.94;1"/></text>
<text x="600.0" y="112" opacity="0">os dois alcançam — e o vão permanece<animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;0;0" keyTimes="0;0.28;0.61;0.94;1"/></text>
</g>
<text x="600.0" y="502" font-family="ui-monospace,monospace" font-size="12" fill="#5E7183" text-anchor="middle">φ = 1.618033989 · nada desenhado: tudo computado</text>
</svg>